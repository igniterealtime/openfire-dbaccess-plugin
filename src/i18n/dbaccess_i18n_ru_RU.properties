plugin.name=Доступ к БД
plugin.description=Предоставляет администраторам простой интерфейс прямого доступа к базе данных Openfire.

dbaccess.title=Панель доступа к БД
dbaccess.caution.avoid.update=<b>НЕ</b> используйте это для редактирования базы данных, если вы не уверены в своих действиях. Openfire не обязательно обрабатывает изменения в своей базе данных из-под себя во время работы. Скорее всего, тот, кто рекомендовал этот плагин, попросил вас попробовать пару команд, поэтому выполняйте только их (ну или других действий для чтения без изменений).
dbaccess.doc.db.schema=Смотрите Описание схемы базы данных
dbaccess.execute=Выполнить SQL запрос
