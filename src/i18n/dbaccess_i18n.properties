plugin.name=DB Access
plugin.description=Provides administrators with a simple direct access interface to their Openfire DB.

dbaccess.title=DB Access Tool
dbaccess.caution.avoid.update=Do <b>NOT</b> use this to edit your database unless you know what you are doing. Openfire will not necessarily handle changes to its database out from under it while it is running.  Most likely you were asked to try a couple of commands by whoever recommended this plugin, so please try to stick to that (or read-only activities).
